name: Publish reviewed blog update
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-reviewed-blog
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'xueyebingshen/jn-blog-updates' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: xueyebingshen/jn-blog-updates
      RELEASE_TAG: v1.0.7
      IMAGE: ghcr.io/xueyebingshen/jn-blog
      BUNDLE_SHA256: 253b8c950914ba88536c012f620c9e7583faf7f2fa6255933c976e856be1d057
    steps:
      - name: Download and verify the reviewed release (no source checkout)
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern 'jn-blog-public-1.0.7.zip' --dir incoming
          echo "$BUNDLE_SHA256  incoming/jn-blog-public-1.0.7.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import zipfile, pathlib
          with zipfile.ZipFile('incoming/jn-blog-public-1.0.7.zip') as z:
              names=z.namelist()
              assert len(names)==len(set(names))
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert i.filename in ('image.tar','release.json') or i.filename.startswith('catalog/apps/jn-blog/')
                  assert (i.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall('reviewed')
          PY
          docker load --input reviewed/image.tar
          docker image inspect jn-blog-public-review:1.0.7 > loaded-image.json
          python3 - <<'PY'
          import json
          actual=json.load(open('loaded-image.json'))[0]
          expected=json.load(open('reviewed/release.json'))
          assert actual['RootFS']['Layers']==expected['rootfsLayers']
          assert actual['Config']['User']=='node'
          assert actual['Os']=='linux' and actual['Architecture']=='amd64'
          assert actual['Config']['Env']==expected['environment']
          PY
      - name: Publish immutable version to GHCR
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_REPOSITORY_OWNER" --password-stdin
          TARGET="$IMAGE:1.0.7"
          # Never replace an existing version. A matching retry is allowed.
          if docker manifest inspect "$TARGET" > existing-manifest.json 2> manifest-error.txt; then
            python3 - <<'PY'
          import json
          m=json.load(open('existing-manifest.json'))
          e=json.load(open('reviewed/release.json'))
          assert m.get('config',{}).get('digest')==e['configDigest'], 'Version exists with different content; stop'
          PY
          else
            # Transport/authentication failure is not proof that the version is absent.
            grep -Eiq 'manifest unknown|no such manifest|name unknown' manifest-error.txt || { cat manifest-error.txt; exit 1; }
            docker tag jn-blog-public-review:1.0.7 "$TARGET"
            docker push "$TARGET"
          fi
          docker pull "$TARGET"
          docker image inspect "$TARGET" > published-image.json
          python3 - <<'PY'
          import json, os, re, pathlib, zipfile, hashlib
          expected=json.load(open('reviewed/release.json'))
          actual=json.load(open('published-image.json'))[0]
          assert actual['RootFS']['Layers']==expected['rootfsLayers']
          refs=[x for x in actual['RepoDigests'] if x.startswith(os.environ['IMAGE']+'@sha256:')]
          assert len(refs)==1 and re.fullmatch(r'ghcr.io/xueyebingshen/jn-blog@sha256:[a-f0-9]{64}',refs[0])
          template=pathlib.Path('reviewed/catalog')
          placeholder='ghcr.io/xueyebingshen/jn-blog@sha256:'+'0'*64
          changed=0
          for f in template.rglob('*'):
              if f.is_file():
                  s=f.read_text(encoding='utf-8')
                  changed+=s.count(placeholder)
                  f.write_text(s.replace(placeholder,refs[0]),encoding='utf-8',newline='\n')
          assert changed==6, 'Expected five program services and release metadata'
          pathlib.Path('out').mkdir()
          archive=pathlib.Path('out/jn-blog-1panel-1.0.7.zip')
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(template.rglob('*')):
                  if f.is_file(): z.write(f,f.relative_to(template).as_posix())
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          pathlib.Path('out/SHA256SUMS.txt').write_text(digest+'  '+archive.name+'\n',encoding='ascii')
          pathlib.Path('out/IMAGE.txt').write_text(refs[0]+'\n',encoding='ascii')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Image published: `'+refs[0]+'`\n\nSet the GHCR package visibility to Public, then verify anonymous pull before installing the 1Panel template. No site data or credentials are needed.\n')
          PY
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" out/* --clobber
      - name: Log out
        if: always()
        run: docker logout ghcr.io
